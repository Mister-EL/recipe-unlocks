# Recipe Unlocks — рецепты закрыты, пока игрок их не откроет.
# После правки файла: /unlocks reload (перезапуск сервера не нужен).

# Режим 1. true — все рецепты закрыты и открываются как в обычной игре (книга рецептов).
#          false — мод выключен, крафт свободный.
lock_all_recipes = true

# Режим 2. true — рецепты дополнительно открываются по условиям из раздела [unlocks].
#          Работает только вместе с режимом 1.
template_unlocks = true

# --- Дополнительно ---

# Рецепты, которые нельзя открыть вообще никак: игра их сама не открывает и в [unlocks] их нет.
# Обычно это рецепты станков из модов. false — оставить доступными, true — закрыть навсегда.
lock_recipes_without_unlock = false

# Автокрафтер (crafter) собирает только то, что открыл игрок, который его поставил,
# и только пока этот игрок в сети. false — автокрафтер собирает всё.
lock_crafter = true

# Скрывать закрытые рецепты от станков из других модов, когда ими пользуется игрок.
# Выключите, если какой-то мод начал вести себя странно.
block_modded_stations = true

# --- Правила ---
#
# Одна строка — одно правило:  что открыть = что сделать
#
# Что открыть: id предмета (откроются все его рецепты), тег предметов или id рецепта.
#   Id виден в игре: F3+H, затем навести курсор на предмет. "minecraft:" можно не писать.
#   Тег пишется в кавычках: "#minecraft:planks" (без кавычек строка с # в начале — это комментарий).
#
# Что сделать: шаблон, цель и количество (без количества — 1 раз).
#   break  блок      сломать блок
#   place  блок      поставить блок
#   jump   блок      прыгнуть, стоя на блоке
#   hit    существо  ударить существо
#   kill   существо  убить существо
#   eat    предмет   съесть или выпить
#   pickup предмет   подобрать с земли
#   drop   предмет   выбросить
#   use    предмет   применить (правая кнопка)
#   craft  предмет   скрафтить или переплавить
#   stat   счётчик   любая статистика игры: stat jump 100, stat sleep_in_bed, stat fish_caught 5
#   Годятся и типы статистики из модов: пишите их id вместо шаблона.
#
# Цель: id (stone, minecraft:stone, create:cogwheel), тег (#minecraft:logs) или * (что угодно).
#
# Несколько условий: & значит "и", | значит "или", скобки группируют.
# Вместо & можно писать "и", вместо | — "или".
#
# Творческий режим не засчитывается. Удары и убийства игроков не считаются.
# Комментарии пишите отдельной строкой.

[unlocks]
# torch = break stone 3 & (eat apple | drop stick)
# furnace = break #minecraft:base_stone_overworld 20
# bow = hit skeleton 2 и pickup string 3
# "#minecraft:planks" = jump #minecraft:logs 5
# create:cogwheel = place #minecraft:logs 10 | stat sleep_in_bed
