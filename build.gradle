plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 26.2 ships Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Game tests live in their own mod, so the released jar contains nothing but the mod itself.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.gametest)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_test" {
            sourceSet(sourceSets.gametest)
        }
    }

    runs {
        // Dedicated server with the mod.
        server {
            server()
            programArgument '--nogui'
            loadedMods = [mods."${mod_id}"]
        }

        // Runs all game tests of the mod on a headless server, then exits.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', "${project.mod_id}_test"
            gameDirectory = project.file('run/gametest')
        }

        // NeoForge client WITHOUT this mod: used to check that the mod is server-only.
        cleanClient {
            client()
            loadedMods = []
            gameDirectory = project.file('run/clean-client')
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}
